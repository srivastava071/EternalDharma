<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Temple Locator — Eternal Dharma</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
    integrity="sha256-sA+e2y9gkQv2E3nWfQjtqYwqI2b3z1f5GgqvJ2h+M0w=" crossorigin=""/>

  <!-- Optional MarkerCluster CSS (if using clustering) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

  <!-- Your CSS -->
  <link rel="stylesheet" href="css/temples.css" />
</head>
<body>
  <header class="page-header">
    <a href="index.html" class="logo-link">← Home</a>
    <h1>Temple Locator — Find Temples across India</h1>
  </header>

  <main class="tmpl-main">
    <aside class="tmpl-left">
      <label for="stateFilter">Filter by State</label>
      <select id="stateFilter">
        <option value="all">All States</option>
        <!-- states populated dynamically -->
      </select>

      <label for="searchBox">Search temple</label>
      <input id="searchBox" type="search" placeholder="Search by temple name..." />

      <div id="templeList" class="temple-list" aria-live="polite">
        <!-- list of temples (populated) -->
      </div>
    </aside>

    <section class="tmpl-map-wrap">
      <div id="map" aria-label="Map showing temple locations"></div>
    </section>
  </main>

  <!-- Modal -->
  <div id="tmplModal" class="tmpl-modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="tmpl-modal-content">
      <button id="tmplClose" class="tmpl-close" aria-label="Close">✖</button>
      <div id="tmplModalInner"></div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-v3f8rQBx1+K2v9Zf9c3dZ+f1o4KQ0vVw3Qd3m3mGkR0=" crossorigin=""></script>

  <!-- MarkerCluster (optional but recommended for lots of markers) -->
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <!-- Your JS -->
  <script src="js/temples.js"></script>
</body>
</html>
